<svg viewBox="0 0 400 120" width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B365D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F2A44;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main banner background - Pantone 5395 C inspired navy -->
  <rect x="0" y="0" width="400" height="120" fill="#1B365D" rx="8" ry="8" filter="url(#shadow)"/>
  
  <!-- Subtle texture overlay -->
  <rect x="0" y="0" width="400" height="120" fill="url(#navyGradient)" opacity="0.6" rx="8" ry="8"/>
  
  <!-- Main text "FOUNDATIONS" - using Graphik-like font -->
  <text x="50" y="70" text-anchor="start" fill="white" font-family="Inter, Graphik, Source Sans Pro, system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" letter-spacing="0.5px">FOUNDATIONS</text>
  
  <!-- Year "'26" - positioned after FOUNDATIONS with proper spacing -->
  <text x="290" y="70" text-anchor="start" fill="#E6E6FA" font-family="Roboto Condensed, Anton, Fjalla One, Arial Black, sans-serif" font-size="44" font-weight="900" letter-spacing="-1px">'26</text>
  
  <!-- Subtle accent line under text -->
  <rect x="50" y="85" width="300" height="2" fill="white" opacity="0.3" rx="1" ry="1"/>
  
  <!-- Clean border outline -->
  <rect x="1" y="1" width="398" height="118" fill="none" stroke="white" stroke-width="1" rx="7" ry="7" opacity="0.2"/>
</svg>